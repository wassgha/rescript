name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit
          npm run typecheck:electron

      # macOS: decode the App Store Connect API key used for notarization.
      - name: Setup Apple API key
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      # macOS: the SpeechAnalyzer helper needs the macOS 26 SDK. The macos-latest
      # image (macOS 26) already defaults to Xcode 26.x, so this normally just
      # confirms the SDK and moves on. The switch is a fallback for the case that
      # bit this image before: a default Xcode pinned to an older major.
      - name: Verify macOS 26 SDK
        if: matrix.os == 'macos-latest'
        run: |
          sdk=$(xcrun --show-sdk-version 2>/dev/null || echo 0)
          major=$(printf '%s' "$sdk" | cut -d. -f1)
          case "$major" in ''|*[!0-9]*) major=0 ;; esac
          if [ "$major" -ge 26 ]; then
            echo "Default toolchain SDK $sdk supports SpeechAnalyzer."
            exit 0
          fi
          echo "Default SDK is $sdk; looking for an Xcode 26+ install."
          best=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's|.*/Xcode_||; s|\.app$||' \
            | awk -F. '$1 >= 26' | sort -V | tail -1)
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26+ on this runner; cannot build the SpeechAnalyzer helper." >&2
            ls -d /Applications/Xcode*.app 2>/dev/null >&2 || true
            exit 1
          fi
          sudo xcode-select -s "/Applications/Xcode_$best.app/Contents/Developer"
          echo "Switched to Xcode $best (SDK $(xcrun --show-sdk-version))."

      - name: Build SpeechAnalyzer helper
        if: matrix.os == 'macos-latest'
        run: make -C native/speechanalyzer build

      # macOS: build, sign (Developer ID), notarize, and publish to GitHub Releases.
      - name: Build, sign & publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Windows / Linux: build (unsigned) and publish to GitHub Releases.
      - name: Build & publish (Windows/Linux)
        if: matrix.os != 'macos-latest'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Flip the draft to published only after every OS build succeeds, so a release
  # never goes live (or reaches auto-update) with partial artifacts.
  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve previous tag
        id: tags
        run: |
          CURRENT="${{ github.ref_name }}"
          PREVIOUS=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${CURRENT}$" | head -1 || true)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: env.AI_GATEWAY_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=("${{ steps.tags.outputs.current }}")
          if [ -n "${{ steps.tags.outputs.previous }}" ]; then
            ARGS+=("${{ steps.tags.outputs.previous }}")
          fi
          npx tsx scripts/generate-release-notes.ts "${ARGS[@]}" > release-notes.md
          gh release edit "${{ github.ref_name }}" \
            --repo wassgha/rescript \
            --notes-file release-notes.md

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo wassgha/rescript \
            --draft=false --latest
