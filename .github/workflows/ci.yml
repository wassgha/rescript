name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (web)
        run: |
          # next-env.d.ts is gitignored; generate it (and route types) before tsc.
          npx next typegen
          npx tsc --noEmit

      - name: Typecheck (electron)
        run: npm run typecheck:electron

      - name: UI localization tests
        run: npm run test:i18n

      - name: Timeline export tests
        run: npm run test:timeline

      # The native-engine tests render through the same static ffmpeg the
      # desktop app bundles (they skip, rather than fail, without it).
      - name: Fetch native ffmpeg
        run: npm run fetch:ffmpeg -- --host

      - name: ffmpeg tests
        run: npm run test:ffmpeg

      - name: Build Next.js
        run: npm run build

      - name: Build Electron main/preload
        run: npm run build:electron
